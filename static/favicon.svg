<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14193d"/>
      <stop offset="100%" stop-color="#090d24"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8072ff"/>
      <stop offset="50%" stop-color="#00d4be"/>
      <stop offset="100%" stop-color="#ef476f"/>
    </linearGradient>
    <linearGradient id="lensRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9385ff"/>
      <stop offset="45%" stop-color="#5b4bdb"/>
      <stop offset="100%" stop-color="#00d4be"/>
    </linearGradient>
    <linearGradient id="coreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="55%" stop-color="#ddfaf5"/>
      <stop offset="100%" stop-color="#a79ff8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="24" y="24" width="464" height="464" rx="116" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="7" />

  <!-- Ambient Glow Radial Halos -->
  <circle cx="190" cy="180" r="120" fill="#6352e8" opacity="0.32" />
  <circle cx="330" cy="330" r="110" fill="#00d4be" opacity="0.22" />

  <!-- Outer Lens Ring -->
  <circle cx="256" cy="256" r="156" fill="none" stroke="url(#lensRing)" stroke-width="24" stroke-linecap="round" filter="url(#glow)"/>
  
  <!-- Optical Highlights -->
  <path d="M 172 126 A 156 156 0 0 1 340 126" fill="none" stroke="#ffffff" stroke-width="9" stroke-linecap="round" opacity="0.88" />
  <path d="M 364 340 A 156 156 0 0 1 286 404" fill="none" stroke="#ef476f" stroke-width="11" stroke-linecap="round" opacity="0.8" />

  <!-- Inner Iris Circle -->
  <circle cx="256" cy="256" r="96" fill="#101538" stroke="#7162f9" stroke-width="6" opacity="0.96" />

  <!-- Sparkle / Star Emblem (✦) -->
  <path d="M 256 170 Q 256 256 342 256 Q 256 256 256 342 Q 256 256 170 256 Q 256 256 256 170 Z" fill="url(#coreGrad)" filter="url(#glow)" />

  <!-- Micro Orbit Accents -->
  <circle cx="356" cy="174" r="11" fill="#00f0d2" />
  <circle cx="156" cy="338" r="9" fill="#ff5c8a" />
</svg>
